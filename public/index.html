<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>出库核对 - PDA</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fb; padding: 8px; color: #1e293b; font-size: 15px; touch-action: manipulation; }
        .app { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        h1 { font-size: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 small { font-size: 12px; font-weight: normal; color: #64748b; }
        .lang-switch { background: #e2e8f0; border: none; border-radius: 30px; padding: 4px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .lang-switch:active { transform: scale(0.95); }
        .status-bar { background: #f1f5f9; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
        .status-row { padding: 6px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
        .status-row.identity { background: #dbeafe; color: #1e293b; font-weight: 600; font-size: 16px; }
        .status-row.identity .label { color: #475569; }
        .status-row.identity .operator-info { background: #bfdbfe; color: #1e3a8a; padding: 0 10px; border-radius: 30px; display: inline-flex; align-items: center; gap: 4px; line-height: 30px; }
        .status-row.identity .change-identity-btn { background: #2563eb; color: white; border: none; border-radius: 30px; padding: 2px 14px; font-size: 14px; cursor: pointer; line-height: 28px; font-weight: 600; transition: 0.15s; }
        .status-row.identity .change-identity-btn:active { transform: scale(0.95); }
        .status-row.progress { background: #f8fafc; font-size: 22px; font-weight: 700; }
        .status-row .label { color: #64748b; font-weight: 400; }
        .status-row .value { font-weight: 700; }
        .global-stats-wrapper { margin-bottom: 10px; border-radius: 8px; border: 1px solid #bae6fd; overflow: hidden; }
        .global-stats-header { background: #e0f2fe; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; font-weight: 600; font-size: 14px; color: #0369a1; }
        .global-stats-header .toggle-icon { font-size: 16px; transition: transform 0.2s; }
        .global-stats-header .toggle-icon.collapsed { transform: rotate(-90deg); }
        .global-stats-content { background: #f0f9ff; padding: 8px 12px; display: flex; flex-wrap: wrap; justify-content: space-between; font-size: 13px; gap: 4px; transition: max-height 0.3s ease; max-height: 150px; overflow: hidden; }
        .global-stats-content.collapsed { max-height: 0; padding: 0 12px; border-top: 0; }
        .global-stats-content .label { color: #0369a1; }
        .global-stats-content .value { font-weight: 700; color: #0c4a6e; }
        .global-stats-content .value-fraction { font-weight: 700; color: #0c4a6e; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border-radius: 30px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.15s; background: #e2e8f0; color: #1e293b; min-height: 44px; min-width: 44px; touch-action: manipulation; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #2563eb; color: white; }
        .btn-success { background: #16a34a; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e1; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .scan-input-group { display: flex; gap: 8px; margin: 10px 0; align-items: center; }
        .scan-input-group input { flex: 1; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 30px; font-size: 18px; background: #f8fafc; outline: none; min-height: 50px; }
        .scan-input-group input:focus { border-color: #2563eb; background: white; }
        .scan-input-group .btn { min-width: 56px; }
        .flex-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
        .flex-row .btn { flex: 1; min-width: 70px; font-size: 14px; padding: 8px 12px; }
        .list-container { margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
        .list-item { display: grid; grid-template-columns: 28px 1fr 50px 44px; padding: 6px 10px; border-bottom: 1px solid #f1f5f9; align-items: center; font-size: 13px; font-family: monospace; }
        .list-item.group-header { background: #f1f5f9; font-weight: 700; font-family: sans-serif; }
        .list-item .status { text-align: center; font-size: 16px; }
        .list-item .badge { font-size: 10px; padding: 1px 8px; border-radius: 30px; background: #e2e8f0; color: #475569; font-family: sans-serif; }
        .list-item .badge.fba { background: #dbeafe; color: #2563eb; }
        .list-item .badge.custom { background: #fef3c7; color: #b45309; }
        .list-item.scanned { background: #dcfce7; }
        .list-item.active { background: #dbeafe; }
        .upload-zone { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 16px; text-align: center; margin-bottom: 10px; cursor: pointer; background: #f8fafc; }
        .upload-zone input[type="file"] { display: none; }
        .file-info { font-size: 13px; color: #64748b; margin-top: 4px; }
        @media (max-width: 768px) { .desktop-only { display: none; } }
        .selected-addresses { background: #f0fdf4; border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; font-size: 13px; color: #166534; border: 1px solid #bbf7d0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
        .selected-addresses .addr-tag { background: #dcfce7; padding: 2px 8px; border-radius: 30px; }
        .selected-addresses .change-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0 4px; }
        .address-selector { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
        .address-selector .title { background: #e2e8f0; padding: 8px 12px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .address-selector .title .count { font-weight: 400; font-size: 13px; color: #475569; }
        .address-selector .title .toggle-icon { font-size: 16px; transition: transform 0.2s; }
        .address-selector .title .toggle-icon.collapsed { transform: rotate(-90deg); }
        .address-selector .body { padding: 10px; transition: max-height 0.3s ease; max-height: 500px; overflow: hidden; }
        .address-selector .body.collapsed { max-height: 0; padding: 0 10px; }
        .address-selector .address-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; min-height: 40px; }
        .address-selector .address-item { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 30px; border: 2px solid #cbd5e1; background: white; cursor: pointer; transition: 0.15s; font-size: 14px; user-select: none; touch-action: manipulation; flex: 0 1 auto; }
        .address-selector .address-item .checkbox { width: 22px; height: 22px; border: 2px solid #94a3b8; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: white; transition: 0.15s; }
        .address-selector .address-item .checkbox::after { content: "✓"; color: white; font-size: 16px; display: none; }
        .address-selector .address-item.selected { border-color: #2563eb; background: #dbeafe; }
        .address-selector .address-item.selected .checkbox { background: #2563eb; border-color: #2563eb; }
        .address-selector .address-item.selected .checkbox::after { display: block; }
        .address-selector .address-item:active { transform: scale(0.96); }
        .address-selector .address-item.disabled { opacity: 0.6; pointer-events: none; }
        .address-selector .confirm-address-btn { width: 100%; margin-top: 4px; }
        .address-selector .status-msg { font-size: 13px; color: #16a34a; text-align: center; margin-top: 4px; }
        .address-empty-tip { padding: 8px 12px; border: 1px dashed #94a3b8; border-radius: 8px; color: #475569; background: #f1f5f9; width: 100%; text-align: center; }
        .reset-collapse-wrapper { margin-top: 8px; border-top: 1px solid #e2e8f0; padding-top: 8px; }
        .reset-collapse-header { display: flex; justify-content: flex-end; align-items: center; cursor: pointer; user-select: none; font-size: 13px; color: #64748b; gap: 6px; }
        .reset-collapse-header .arrow { transition: transform 0.2s; display: inline-block; }
        .reset-collapse-header .arrow.open { transform: rotate(90deg); }
        .reset-collapse-body { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
        .reset-collapse-body.open { max-height: 80px; }
        .reset-collapse-body .btn { width: 100%; margin-top: 6px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal { background: white; border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal h2 { margin-bottom: 16px; font-size: 20px; text-align: center; }
        .modal label { display: block; margin: 12px 0 4px; font-weight: 500; }
        .modal input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; }
        .modal .btn { width: 100%; margin-top: 16px; }
        .modal .btn-cancel { background: #e2e8f0; color: #1e293b; margin-top: 8px; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 15px; z-index: 2000; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none; max-width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); transform: translateX(-50%) translateY(-20px); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        .toast.warning { background: #f59e0b; }
        .toggle-done-btn { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 4px 14px; border-radius: 30px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.15s; color: #1e293b; margin-bottom: 6px; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; }
        .toggle-done-btn.active { background: #dbeafe; border-color: #2563eb; color: #2563eb; }
    </style>
</head>
<body>
    <div class="app" id="app">
        <h1>
            <span id="pageTitle">📦 出库核对</span>
            <small id="connectionStatus">● 未连接</small>
            <button class="lang-switch" id="langSwitch">Español</button>
        </h1>
        <div class="status-bar">
            <div class="status-row identity">
                <span class="operator-info"><span class="label" id="lblOperator">扫描员:</span> <span id="operatorDisplay">-</span></span>
                <span class="operator-info"><span class="label" id="lblVehicle">车牌:</span> <span id="vehicleDisplay">-</span></span>
                <button class="change-identity-btn" id="changeIdentityBtn">🔄 更换身份</button>
            </div>
            <div class="status-row progress">
                <span><span class="label" id="lblMode">本机模式:</span> <span id="modeDisplay">主码</span></span>
                <span><span class="label" id="lblTask">当前任务:</span> <span id="taskKeysDisplay">无</span></span>
                <span><span class="label" id="lblPending">待添加:</span> <span id="pendingDisplay">无</span></span>
                <span><span class="label" id="lblScanned">已扫:</span> <span id="mySubProgress">0/0</span></span>
            </div>
        </div>
        <div class="selected-addresses" id="selectedAddressesDisplay" style="display:none;">
            <span id="lblSelectedAddresses">📍 已选地址：</span>
            <span id="addrTags"></span>
            <button class="change-btn" id="changeAddressBtn">更改</button>
        </div>
        <div class="global-stats-wrapper">
            <div class="global-stats-header" id="globalStatsToggle">
                <span id="lblGlobalStats">📊 全局统计</span>
                <span class="toggle-icon" id="globalStatsIcon">▼</span>
            </div>
            <div class="global-stats-content" id="globalStatsContent">
                <span><span class="label" id="lblTotalMain">📦 总主码:</span> <span class="value" id="globalMainCount">0</span></span>
                <span><span class="label" id="lblTotalBox">📦 总箱数:</span> <span class="value" id="globalTotalBox">0</span></span>
                <span><span class="label" id="lblCompletedMain">✅ 已扫主码:</span> <span class="value-fraction" id="globalScanned">0/0</span></span>
                <span><span class="label" id="lblUnscannedSub">⬜ 未扫子码/箱数:</span> <span class="value-fraction" id="globalUnscanned">0/0</span></span>
            </div>
        </div>
        <div class="address-selector" id="addressSelector">
            <div class="title" id="addressToggle">
                <span id="lblDeliveryAddress">📍 派送地址</span>
                <span class="count"><span id="lblSelectedCount">已选</span> <span id="inlineSelectedCount">0</span> <span id="lblAddrUnit">个</span></span>
                <span class="toggle-icon" id="addressIcon">▼</span>
            </div>
            <div class="body" id="addressBody">
                <div class="address-grid" id="addressGrid"></div>
                <button class="btn btn-primary confirm-address-btn" id="inlineConfirmAddress">确认地址</button>
                <div class="status-msg" id="addressStatusMsg"></div>
            </div>
        </div>
        <div class="upload-zone desktop-only" id="uploadZone">
            <span style="font-size:28px;">📂</span>
            <p id="lblUploadPrompt">点击上传出库表 (.xlsx/.xls)</p>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
            <div class="file-info" id="fileInfo"><span id="lblNotUploaded">未上传</span></div>
        </div>
        <div class="scan-input-group">
            <input type="text" id="scanInput" placeholder="扫描条码..." autofocus>
            <button class="btn btn-primary" id="scanBtn">↵</button>
        </div>
        <div class="flex-row">
            <button class="btn btn-warning" id="endMainBtn">✅ 结束主码</button>
            <button class="btn btn-danger" id="forceEndBtn">⏹ 强制结束</button>
            <button class="btn btn-outline" id="resetBatchBtn">🔄 重置我的主码</button>
            <button class="btn btn-outline toggle-done-btn" id="toggleDoneBtn">显示全部</button>
        </div>
        <div class="reset-collapse-wrapper">
            <div class="reset-collapse-header" id="resetCollapseToggle">
                <span id="lblAdvanced">⚙️ 高级操作</span>
                <span class="arrow" id="resetCollapseArrow">▶</span>
            </div>
            <div class="reset-collapse-body" id="resetCollapseBody">
                <button class="btn btn-outline" id="resetAllBtn" style="color:#dc2626;">🔁 全部重置（清除所有数据）</button>
            </div>
        </div>
        <div class="list-container" id="listContainer">
            <div id="listBody" style="max-height:45vh;overflow-y:auto;">
                <div style="padding:20px;text-align:center;color:#94a3b8;" id="lblNoData">请上传文件或等待数据同步</div>
            </div>
        </div>
        <div style="margin-top:10px;display:flex;gap:6px;">
            <button class="btn btn-success" id="exportTxtBtn">📄 TXT</button>
            <button class="btn btn-primary" id="exportExcelBtn">📊 Excel</button>
        </div>
    </div>
    <!-- 自定义确认对话框 -->
    <div class="modal-overlay" id="confirmModal" style="display:none;">
        <div class="modal">
            <h2 id="confirmTitle">⚠️ 确认</h2>
            <p id="confirmMessage"></p>
            <button class="btn btn-primary" id="confirmOkBtn">确定</button>
            <button class="btn btn-cancel" id="confirmCancelBtn">取消</button>
        </div>
    </div>
    <div class="modal-overlay" id="operatorModal" style="display:none;">
        <div class="modal">
            <h2 id="modalTitle">🔐 身份验证</h2>
            <label id="lblOperatorName">扫描员姓名</label>
            <input type="text" id="operatorInput" placeholder="请输入姓名" autofocus>
            <label id="lblVehiclePlate">车牌号</label>
            <input type="text" id="vehicleInput" placeholder="请输入车牌号">
            <button class="btn btn-primary" id="confirmOperatorBtn">确认</button>
            <button class="btn btn-cancel" id="cancelOperatorBtn">取消</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>

            }

            function loadLocalState() {
                try {
                    const mode = localStorage.getItem('pda_localMode');
                    const task = localStorage.getItem('pda_taskKeys');
                    const pending = localStorage.getItem('pda_pendingKeys');
                    const filter = localStorage.getItem('pda_filterMode');
                    const collapsed = localStorage.getItem('pda_statsCollapsed');
                    const resetCol = localStorage.getItem('pda_resetCollapsed');
                    const addr = localStorage.getItem('pda_selectedAddresses');
                    const addrColl = localStorage.getItem('pda_addressCollapsed');
                    const batchData = localStorage.getItem('pda_batches');
                    if (mode) localMode = mode;
                    if (task) { const p = JSON.parse(task); if (Array.isArray(p)) taskKeys = p; }
                    if (pending) { const p = JSON.parse(pending); if (Array.isArray(p)) pendingKeys = p; }
                    if (filter && ['all','done','undone'].includes(filter)) filterMode = filter;
                    if (collapsed) globalStatsCollapsed = JSON.parse(collapsed);
                    if (resetCol) resetCollapsed = JSON.parse(resetCol);
                    if (addr) { const p = JSON.parse(addr); if (Array.isArray(p)) selectedAddresses = p; }
                    if (addrColl !== null) addressCollapsed = JSON.parse(addrColl);
                    if (batchData) {
                        const p = JSON.parse(batchData);
                        if (Array.isArray(p)) {
                            batches = p.map(b => {
                                if (b.operator === undefined) b.operator = '';
                                if (b.vehicle === undefined) b.vehicle = '';
                                return b;
                            });
                        }
                    }
                } catch (e) { console.warn('加载本地状态失败:', e); }
            }

            // ---- Toast ----
            function showToast(msg, type = 'info', duration = 3000) {
                if (toastTimer) clearTimeout(toastTimer);
                // 翻译消息（如果当前语言不是中文）
                if (currentLang !== 'zh') {
                    // 简单替换常见模式
                    msg = msg.replace(/✅ 已添加主码: /g, t('main_added'));
                    msg = msg.replace(/✅ 已扫描: /g, t('sub_scanned'));
                    msg = msg.replace(/❌ 主码 /g, '❌ Código ');
                    msg = msg.replace(/已被其他设备锁定，不可重复扫描/g, 'bloqueado por otro dispositivo, no se puede repetir');
                    msg = msg.replace(/❌ 无效子码: /g, '❌ Subcódigo inválido: ');
                    msg = msg.replace(/⏳ 子码 /g, '⏳ Subcódigo ');
                    msg = msg.replace(/已扫描过/g, 'ya escaneada');
                    msg = msg.replace(/不属于当前任务主码/g, 'no pertenece al código actual');
                    msg = msg.replace(/⏳ 主码 /g, '⏳ Código ');
                    msg = msg.replace(/已完成，无需再次添加/g, 'completado, no se puede agregar nuevamente');
                    msg = msg.replace(/❌ 未找到主码: /g, '❌ Código no encontrado: ');
                    // 补扫消息已在其他地方处理
                }
                toastEl.textContent = msg;
                toastEl.className = 'toast';
                if (type === 'success') toastEl.classList.add('success');
                else if (type === 'error') toastEl.classList.add('error');
                else if (type === 'warning') toastEl.classList.add('warning');
                toastEl.classList.add('show');
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, duration);
                console.log(`[Toast] ${type}: ${msg}`);
            }

            // ---- 统计 ----
            function getTaskStats() {
                let total = 0,
                    scanned = 0;
                for (const key of taskKeys) {
                    const g = state.groups.find(gr => gr.key === key);
                    if (g) {
                        total += g.items.length;
                        for (const item of g.items) {
                            if (state.scanStatus[item.code]) scanned++;
                        }
                    }
                }
                return { total, scanned };
            }

            function getGlobalStats() {
                const totalMain = state.groups.length;
                let totalBoxes = 0,
                    completedMain = 0,
                    unscannedBoxes = 0;
                for (const g of state.groups) {
                    totalBoxes += g.items.length;
                    const allScanned = g.items.every(item => state.scanStatus[item.code] || false);
                    if (allScanned) completedMain++;
                    for (const item of g.items) {
                        if (!state.scanStatus[item.code]) unscannedBoxes++;
                    }
                }
                return { totalMain, totalBoxes, completedMain, unscannedBoxes };
            }

            function isMainCompleted(key) {
                const g = state.groups.find(gr => gr.key === key);
                if (!g) return false;
                return g.items.every(item => state.scanStatus[item.code] || false);
            }

            function getFilteredMainKeys() {
                if (selectedAddresses.length === 0) return state.groups.map(g => g.key);
                const filtered = [];
                for (const g of state.groups) {
                    if (g.recipients && g.recipients.some(r => selectedAddresses.includes(r))) {
                        filtered.push(g.key);
                    }
                }
                return filtered;
            }

                globalScanned.textContent = `${global.completedMain}/${global.totalMain}`;

                if (selectedAddresses.length > 0) {

                saveLocalState();

                if (localMode === 'sub' && taskKeys.length > 0 && stats.total > 0 && stats.scanned === stats.total) {

                    localMode = 'main';

                }
            }

            // ---- WebSocket ----
            function connectWebSocket() {
                if (ws && ws.readyState === WebSocket.OPEN) return;
                try {
                    console.log('🔌 正在连接 WebSocket:', WS_URL);
                    ws = new WebSocket(WS_URL);
                    ws.onopen = function() {
                        connectionStatus.textContent = t('connection');
                        connectionStatus.style.color = '#16a34a';
                        showToast(t('connected'), 'success', 2000);
                        if (allGroups.length > 0 && allRecipients.length > 0) {
                            ws.send(JSON.stringify({ type: 'init', groups: allGroups, recipients: allRecipients, deviceId }));
                        }
                    };
                    ws.onmessage = function(event) {
                        try {
                            const data = JSON.parse(event.data);
                            console.log('📨 收到服务器消息:', data);
                            if (data.type === 'state') {
                                state = data.state;
                                taskKeys = taskKeys.filter(k => state.selectedMainKeys.includes(k));
                                pendingKeys = pendingKeys.filter(k => state.selectedMainKeys.includes(k));
                                if (localMode === 'sub' && taskKeys.length === 0) {
                                    localMode = 'main';
                                    showToast(t('task_invalid'), 'warning', 2000);
                                }
                                renderList();
                                updateStatusBar();
                            } else if (data.type === 'addresses') {
                                allRecipients = data.recipients || [];
                                if (allRows.length > 0) {
                                    let readonly = false;
                                    if (selectedAddresses.length > 0) {
                                        const valid = selectedAddresses.every(a => allRecipients.includes(a));
                                        if (valid) readonly = true;
                                        else selectedAddresses = [];
                                    }
                                    renderAddressSelector(allRecipients, allRows, readonly);
                                } else {
                                    renderAddressSelector(allRecipients, [], false);
                                }
                            } else if (data.type === 'success') {
                                const msg = data.message;
                                console.log('🔍 成功消息内容:', msg);
                                // 补扫消息
                                const patchMatch = msg.match(/可补扫主码:\s*([^\s]+)\s*\(剩余\s*(\d+)\s*箱未扫\)/);
                                if (patchMatch) {
                                    const patchKey = patchMatch[1];
                                    const remaining = parseInt(patchMatch[2]);
                                    showToast(`${t('patch_scan')}${patchKey} (${remaining} ${t('box_singular')})`, 'info', 3000);
                                    if (!pendingKeys.includes(patchKey)) {
                                        pendingKeys.push(patchKey);
                                        renderList();
                                        updateStatusBar();
                                    }
                                    scanInput.value = '';
                                    scanInput.focus();
                                    return;
                                }
                                // 主码添加
                                const match = msg.match(/已添加主码:\s*([^\s]+)/);
                                if (match) {
                                    const key = match[1];
                                    if (isMainCompleted(key)) {
                                        showToast(t('main_completed', { key }), 'warning', 2000);
                                        scanInput.value = '';
                                        scanInput.focus();
                                        return;
                                    }
                                    const filtered = getFilteredMainKeys();
                                    if (filtered.length > 0 && !filtered.includes(key)) {
                                        showToast(t('not_belong', { key }), 'warning', 2000);
                                        scanInput.value = '';
                                        scanInput.focus();
                                        return;
                                    }
                                    if (!pendingKeys.includes(key)) {
                                        pendingKeys.push(key);
                                        renderList();
                                        updateStatusBar();
                                        // 显示翻译后的消息
                                        const group = state.groups.find(g => g.key === key);
                                        const boxText = group ? translateBoxCount(group.items.length) : '';
                                        showToast(t('main_added') + key + (boxText ? ' (' + boxText + ')' : ''), 'success', 2000);
                                    }
                                    scanInput.value = '';
                                    scanInput.focus();
                                    return;
                                }
                                // 子码扫描
                                const subMatch = msg.match(/✅ 已扫描:\s*([^\s]+)\s*\((\d+)\/(\d+)\)/);
                                if (subMatch) {
                                    const code = subMatch[1];
                                    const scanned = parseInt(subMatch[2]);
                                    const total = parseInt(subMatch[3]);
                                    showToast(t('sub_scanned') + code + t('sub_progress', { scanned, total }), 'success', 2000);
                                    scanInput.value = '';
                                    scanInput.focus();
                                    return;
                                }
                                // 其他成功消息（释放、重置等）直接显示（已由 showToast 翻译）
                                showToast(data.message, 'success', 2000);
                                scanInput.value = '';
                                scanInput.focus();
                            } else if (data.type === 'error') {
                                // 错误消息直接显示，showToast 会尝试翻译
                                showToast(data.message, 'error', 3000);
                                scanInput.value = '';
                                scanInput.focus();
                            }
                        } catch (err) {
                            console.error('❌ 解析消息失败:', err);
                        }
                    };
                    ws.onclose = function() {
                        connectionStatus.textContent = t('disconnected');
                        connectionStatus.style.color = '#dc2626';
                        showToast(t('disconnected_msg'), 'error');
                        if (reconnectTimer) clearTimeout(reconnectTimer);
                        reconnectTimer = setTimeout(connectWebSocket, 3000);
                    };
                    ws.onerror = function(err) {
                        console.error('❌ WebSocket错误:', err);
                        ws.close();
                    };
                } catch (err) {
                    console.error('❌ 连接失败:', err);
                    setTimeout(connectWebSocket, 3000);
                }
            }

            // ---- 发送扫描 ----
            function sendScan(code) {
                if (!code || code.trim() === '') {
                    showToast(t('invalid_scan'), 'warning');
                    return;
                }
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    showToast(t('server_error'), 'error');
                    return;
                }
                const trimmed = code.trim();
                if (localMode === 'main') {
                    if (pendingKeys.includes(trimmed)) {
                        showToast(t('already_added', { key: trimmed }), 'warning', 2000);
                        scanInput.value = '';
                        scanInput.focus();
                        return;
                    }
                    const filtered = getFilteredMainKeys();
                    if (filtered.length > 0 && !filtered.includes(trimmed)) {
                        showToast(t('not_belong', { key: trimmed }), 'warning', 3000);
                        scanInput.value = '';
                        scanInput.focus();
                        return;
                    }
                    ws.send(JSON.stringify({ type: 'scan', code: trimmed, mode: 'main', deviceId }));
                } else {
                    let belongs = false;
                    for (const key of taskKeys) {
                        const g = state.groups.find(gr => gr.key === key);
                        if (g) {
                            if (g.items.find(i => i.code === trimmed)) { belongs = true; break; }
                            const parts = trimmed.split('/');
                            if (parts.length === 2 && parts[0] === key) {
                                const idx = parseInt(parts[1]);
                                if (!isNaN(idx) && idx >= 1 && idx <= g.items.length) { belongs = true; break; }
                            }
                        }
                    }
                    if (!belongs) {
                        showToast(t('sub_not_belong', { code: trimmed }), 'error', 3000);
                        scanInput.value = '';
                        scanInput.focus();
                        return;
                    }
                    ws.send(JSON.stringify({ type: 'scan', code: trimmed, mode: 'sub', deviceId }));
                }
            }

            // ---- 结束主码 ----
            function switchToSubMode() {
                if (pendingKeys.length === 0) {
                    showToast(t('no_pending'), 'warning');
                    return;
                }
                if (localMode === 'sub') {
                    showToast(t('already_sub'), 'warning');
                    return;
                }
                const batchName = `Tarima${batches.length + 1}`;
                batches.push({
                    name: batchName,
                    keys: [...pendingKeys],
                    operator: operator || '',
                    vehicle: vehicle || ''
                });
                showToast(`${t('batch_recorded')}${batchName} (${pendingKeys.length} ${t('main_mode')})`, 'success', 3000);

                taskKeys = [...pendingKeys];
                pendingKeys = [];
                localMode = 'sub';
                updateStatusBar();
                renderList();
                showToast(`${t('switch_sub')}${taskKeys.join(', ')}`, 'success', 2000);
                scanInput.focus();
                saveLocalState();
            }

            // ---- 强制结束（使用自定义 confirm） ----
            async function forceEnd() {
                if (localMode === 'main') {
                    showToast(t('already_sub'), 'warning');
                    return;
                }
                if (taskKeys.length === 0) {
                    showToast(t('no_task'), 'warning');

                if (stats.scanned === stats.total) {

                localMode = 'main';
                updateStatusBar();
                renderList();
                showToast(`${t('force_end_msg')}${stats.total - stats.scanned}${t('force_end_sub')}`, 'warning', 4000);
                scanInput.focus();

            // ---- 重置我的主码 ----
            async function resetMyKeys() {
                const allKeys = [...new Set([...taskKeys, ...pendingKeys])];
                if (allKeys.length === 0) {
                    showToast(t('no_keys_to_reset'), 'warning');
                    return;
                }

                    showToast(t('server_error'), 'error');
                    return;
                }
                const confirmMsg = t('confirm_release') + allKeys.join(', ');
                const confirmed = await showConfirm(confirmMsg, currentLang === 'zh' ? '⚠️ 确认' : '⚠️ Confirmar');
                if (!confirmed) return;
                ws.send(JSON.stringify({ type: 'release_keys', keys: allKeys, deviceId }));
                taskKeys = [];
                pendingKeys = [];
                localMode = 'main';
                updateStatusBar();
                renderList();
                showToast(`${t('release_keys')}${allKeys.join(', ')}`, 'info', 3000);

            // ---- 全部重置 ----
            async function resetAll() {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    showToast(t('server_error'), 'error');
                    return;
                }
                const confirmMsg = t('confirm_reset_all');
                const confirmed = await showConfirm(confirmMsg, currentLang === 'zh' ? '⚠️ 确认' : '⚠️ Confirmar');
                if (!confirmed) return;
                ws.send(JSON.stringify({ type: 'reset_all' }));
                taskKeys = [];
                pendingKeys = [];
                localMode = 'main';
                batches = [];

            // ---- 渲染清单 ----
            function renderList() {
                const groups = state.groups;
                if (groups.length === 0) {
                    listBody.innerHTML = `<div style="padding:20px;text-align:center;color:#94a3b8;">${t('no_data')}</div>`;
                    return;
                }

                const filteredKeys = getFilteredMainKeys();
                let html = '';
                let globalIdx = 0;
                const taskSet = new Set(taskKeys);
                const pendingSet = new Set(pendingKeys);

                for (const g of groups) {
                    if (filteredKeys.length > 0 && !filteredKeys.includes(g.key)) continue;

                    const isTask = taskSet.has(g.key);
                    const isPending = pendingSet.has(g.key);
                    const allScanned = g.items.every(item => state.scanStatus[item.code] || false);
                    const typeLabel = g.type === 'fba' ? 'FBA' : '自定义';
                    const typeClass = g.type === 'fba' ? 'fba' : 'custom';
                    const boxText = translateBoxCount(g.items.length);

                    if (filterMode === 'done' && !allScanned) continue;
                    if (filterMode === 'undone' && allScanned) continue;

                    globalIdx++;
                    let statusText = '';
                    if (isTask) statusText = '📋 任务中';
                    else if (isPending) statusText = '⏳ 待添加';
                    else statusText = '';
                    const isActive = isTask && localMode === 'sub';
                    html += `
                        <div class="list-item group-header ${isActive ? 'active' : ''}">
                            <span>${globalIdx}</span>
                            <span class="code">${g.key} <span class="badge">${boxText}</span> ${statusText} ${allScanned ? '✅ 完成' : ''}</span>
                            <span class="badge ${typeClass}">${typeLabel}</span>
                            <span class="status">${allScanned ? '✅' : '⬜'}</span>
                        </div>
                    `;

                    for (let i = 0; i < g.items.length; i++) {
                        const item = g.items[i];
                        globalIdx++;
                        const scanned = state.scanStatus[item.code] || false;
                        let displayCode = item.code;
                        if (g.type === 'fba') {
                            displayCode = `${g.key}/${i+1}`;
                        }
                        const isActiveItem = isTask && localMode === 'sub';
                        html += `
                            <div class="list-item ${scanned ? 'scanned' : ''} ${isActiveItem ? 'active' : ''}">
                                <span>${globalIdx}</span>
                                <span>${displayCode}</span>
                                <span class="badge" style="opacity:0.5;">${t('sub_mode')}</span>
                                <span class="status">${scanned ? '✅' : '⬜'}</span>
                            </div>
                        `;
                    }
                }
                if (html === '') {
                    const msg = filterMode === 'done' ? '暂无已完成的主码' :
                               filterMode === 'undone' ? '暂无未完成的主码' : '没有匹配的分组';
                    html = `<div style="padding:20px;text-align:center;color:#94a3b8;">${msg}</div>`;
                }
                listBody.innerHTML = html;
            }

            // ---- 构建分组 ----
            function buildGroupsFromRows(rows) {
                const raw = [];
                for (const row of rows) {
                    let kVal = row.k || '';
                    let asVal = row.as || '';
                    let statusVal = row.status || '';
                    let recipient = row.recipient || '';
                    let code = kVal || asVal;
                    if (!code) continue;
                    let type = 'fba',
                        prefix = '';
                    if (kVal) { type = 'fba';
                        prefix = kVal; } else if (asVal) { type = 'custom';
                        prefix = extractPrefix(asVal); } else continue;
                    raw.push({ k: kVal, as: asVal, code: asVal || kVal, prefix, type, status: statusVal, recipient });
                }

                const map = new Map();
                for (const item of raw) {
                    const key = item.prefix;
                    const gkey = key + '|' + item.type;
                    if (!map.has(gkey)) {
                        map.set(gkey, { key, type: item.type, items: [], recipients: new Set(), hasCanceled: false });
                    }
                    const g = map.get(gkey);
                    g.items.push({ code: item.code, raw: item });
                    if (item.recipient) g.recipients.add(item.recipient);
                    if (item.status === '已取消') g.hasCanceled = true;
                }
                const groups = [];
                for (const [_, g] of map) {
                    g.items.sort((a, b) => {
                        const na = parseInt(a.code.replace(/^.*?(\d+)$/, '$1'));
                        const nb = parseInt(b.code.replace(/^.*?(\d+)$/, '$1'));
                        if (!isNaN(na) && !isNaN(nb)) return na - nb;
                        return a.code.localeCompare(b.code);
                    });
                    g.recipients = Array.from(g.recipients);
                    groups.push(g);
                }
                groups.sort((a, b) => {
                    if (a.type !== b.type) return a.type === 'fba' ? -1 : 1;
                    return a.key.localeCompare(b.key);
                });
                return groups;
            }

            function extractPrefix(val) {
                if (!val) return val;
                const s = String(val).trim();
                if (s.includes('/')) return s.split('/')[0].trim();
                const m = s.match(/^(.*?[A-Za-z])U\d+$/);
                if (m) return m[1] + 'U';
                const m2 = s.match(/^(.*?[A-Za-z])\d+$/);
                if (m2 && m2[1].length >= 2) return m2[1];
                return s;
            }

            // ---- 解析文件 ----
            function parseExcelData(rows) {
                let kCol = null,
                    asCol = null,
                    statusCol = null,
                    recipientCol = null;
                const headers = Object.keys(rows[0] || {});
                console.log('📋 检测到的列名:', headers);

                const excludeKeywords = ['tax', '税号', '税务'];

                for (const h of headers) {
                    const clean = h.trim();
                    if (clean.toLowerCase() === 'recipient' || clean.toLowerCase() === '收件人') {
                        recipientCol = h;
                        break;
                    }
                }

                if (!recipientCol) {
                    for (const h of headers) {
                        const clean = h.trim();
                        const lower = clean.toLowerCase();
                        if ((lower.includes('recipient') || lower.includes('收件人')) &&
                            !excludeKeywords.some(kw => lower.includes(kw.toLowerCase()))) {
                            recipientCol = h;
                            break;
                        }
                    }
                }

                if (!recipientCol) {
                    for (const h of headers) {
                        const clean = h.trim();
                        const lower = clean.toLowerCase();
                        if (lower.includes('收件') || lower.includes('recipient')) {
                            recipientCol = h;
                            break;
                        }
                    }
                }

                if (!recipientCol && headers.length >= 20) {
                    recipientCol = headers[19];
                    if (recipientCol && excludeKeywords.some(kw => recipientCol.toLowerCase().includes(kw.toLowerCase()))) {
                        recipientCol = null;
                    }
                }

                for (const h of headers) {
                    const clean = h.trim();
                    if (clean.includes('FBA货件ID') || clean.includes('FBAShipmentID') || clean.includes('货件ID')) kCol = h;
                    if (clean.includes('Custom box barcode') || clean.includes('自定义箱条码') || clean.includes('箱条码')) asCol = h;
                    if (clean.includes('Status') || clean.includes('状态')) statusCol = h;
                }
                if (!kCol && !asCol) {
                    showToast(t('no_data_parsed'), 'error');
                    return null;
                }

                const parsedRows = [];
                const recipientSet = new Set();
                for (const row of rows) {
                    let kVal = kCol ? String(row[kCol] || '').trim() : '';
                    let asVal = asCol ? String(row[asCol] || '').trim() : '';
                    let statusVal = statusCol ? String(row[statusCol] || '').trim() : '';
                    let recipient = recipientCol ? String(row[recipientCol] || '').trim() : '';
                    if (!kVal && !asVal) continue;
                    if (recipient) recipientSet.add(recipient);
                    parsedRows.push({
                        k: kVal,
                        as: asVal,
                        status: statusVal,
                        recipient: recipient
                    });
                }
                console.log('📌 提取到的收件人列表:', Array.from(recipientSet));
                return { rows: parsedRows, recipients: Array.from(recipientSet) };
            }

            // ---- 地址选择器渲染 ----
            function renderAddressSelector(recipients, rows, readonly = false) {
                if (!recipients || recipients.length === 0) {
                    addressGrid.innerHTML = `<div class="address-empty-tip">${t('no_delivery_address')}</div>`;
                    inlineSelectedCount.textContent = '0';
                    if (!readonly) {
                        inlineConfirmAddress.textContent = t('confirm_address');
                        inlineConfirmAddress.className = 'btn btn-primary confirm-address-btn';
                        addressStatusMsg.textContent = '';
                        inlineConfirmAddress.onclick = function() {
                            selectedAddresses = [];
                            addressConfirmed = true;
                            renderList();
                            updateStatusBar();
                            showToast(t('address_all'), 'success');
                            renderAddressSelector(recipients, rows, true);
                        };
                    } else {
                        inlineConfirmAddress.textContent = t('change');
                        inlineConfirmAddress.className = 'btn btn-outline confirm-address-btn';
                        addressStatusMsg.textContent = t('current_all');
                        addressStatusMsg.style.color = '#64748b';
                        inlineConfirmAddress.onclick = function() {
                            renderAddressSelector(recipients, rows, false);
                        };
                    }
                    return;
                }

                addressGrid.innerHTML = '';
                let selected = [];
                if (readonly && selectedAddresses.length > 0) {
                    selected = [...selectedAddresses];
                } else if (!readonly && selectedAddresses.length > 0) {
                    selected = [...selectedAddresses];
                }

                recipients.forEach(addr => {
                    const item = document.createElement('div');
                    item.className = 'address-item';
                    if (selected.includes(addr)) item.classList.add('selected');
                    if (readonly && !selected.includes(addr)) item.classList.add('disabled');
                    item.innerHTML = `
                        <span class="checkbox"></span>
                        <span>${addr}</span>
                    `;
                    if (!readonly) {
                        item.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const idx = selected.indexOf(addr);
                            if (idx >= 0) {
                                selected.splice(idx, 1);
                                item.classList.remove('selected');
                            } else {
                                selected.push(addr);
                                item.classList.add('selected');
                            }
                            inlineSelectedCount.textContent = selected.length;
                        });
                    }
                    addressGrid.appendChild(item);
                });

                inlineSelectedCount.textContent = selected.length;

                if (readonly) {
                    inlineConfirmAddress.textContent = t('change');
                    inlineConfirmAddress.className = 'btn btn-outline confirm-address-btn';
                    addressStatusMsg.textContent = t('confirmed_addresses', { count: selected.length });
                    addressStatusMsg.style.color = '#16a34a';
                    inlineConfirmAddress.onclick = function() {
                        renderAddressSelector(recipients, rows, false);
                    };
                } else {
                    inlineConfirmAddress.textContent = t('confirm_address');
                    inlineConfirmAddress.className = 'btn btn-primary confirm-address-btn';
                    addressStatusMsg.textContent = '';
                    inlineConfirmAddress.onclick = function() {
                        if (selected.length === 0) {
                            showToast(t('please_select_address'), 'warning');
                            return;
                        }
                        selectedAddresses = selected;
                        addressConfirmed = true;
                        renderList();
                        updateStatusBar();
                        showToast(t('address_selected', { count: selected.length }), 'success');
                        renderAddressSelector(recipients, rows, true);
                    };
                }
            }

            // ---- 上传文件 ----
            function handleFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

                        const parsed = parseExcelData(rows);
                        if (!parsed) return;
                        if (parsed.rows.length === 0) {
                            showToast(t('no_data_parsed'), 'error');
                            return;
                        }

                        fileInfo.innerHTML = `<span id="lblNotUploaded">${t('parsed_info')}${file.name} (${parsed.rows.length}${t('rows_info')}${parsed.recipients.length}${t('recipients_info')})</span>`;
                        allRows = parsed.rows;

                        const completeGroups = buildGroupsFromRows(parsed.rows);
                        allGroups = completeGroups;
                        const recips = parsed.recipients || [];
                        allRecipients = recips;

                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'init', groups: completeGroups, recipients: recips, deviceId }));
                        } else {
                            showToast(t('waiting_upload'), 'info');
                        }

                        if (recips.length > 0) {
                            showToast(t('no_recipient', { count: recips.length }), 'success', 3000);
                        } else {
                            showToast(t('no_recipient_found'), 'warning', 3000);
                        }

                        let readonly = false;
                        if (selectedAddresses.length > 0) {
                            const valid = selectedAddresses.every(a => recips.includes(a));
                            if (valid) readonly = true;
                            else selectedAddresses = [];
                        }
                        renderAddressSelector(recips, parsed.rows, readonly);

                    } catch (err) {
                        showToast(`${t('file_upload_error')}${err.message}`, 'error');
                        console.error('解析错误:', err);
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            // ---- 切换过滤模式 ----
            function toggleFilterMode() {
                const modes = ['all', 'done', 'undone'];
                const idx = modes.indexOf(filterMode);
                filterMode = modes[(idx + 1) % 3];
                toggleDoneBtn.setAttribute('data-filter-mode', filterMode);
                saveLocalState();
                renderList();
                updateStatusBar();
            }

            // ---- 导出 TXT ----
            function exportTxt() {
                const lines = [];
                lines.push('出库复核清单');
                lines.push(`生成: ${new Date().toLocaleString()}`);
                if (selectedAddresses.length) lines.push(`收件人: ${selectedAddresses.join(', ')}`);
                lines.push('─'.repeat(50));

                if (batches.length === 0) {
                    for (const g of state.groups) {
                        if (selectedAddresses.length > 0 && g.recipients && !g.recipients.some(r => selectedAddresses.includes(r))) continue;
                        const typeLabel = g.type === 'fba' ? 'FBA货件' : '自定义箱条码';
                        lines.push(`【${typeLabel}: ${g.key}】 ${g.items.length} 箱`);
                        for (let i = 0; i < g.items.length; i++) {
                            const item = g.items[i];
                            let displayCode = item.code;
                            if (g.type === 'fba') displayCode = `${g.key}/${i+1}`;
                            const scanned = state.scanStatus[item.code] || false;
                            lines.push(`  ${String(i+1).padStart(3,' ')}. ${scanned ? '✅' : '⬜'} ${displayCode}`);
                        }
                        lines.push('');
                    }
                } else {
                    for (const batch of batches) {
                        const identity = batch.operator || batch.vehicle ? `${batch.operator} ${batch.vehicle}`.trim() : '未知';
                        lines.push(`📦 ${batch.name} (${identity})`);
                        lines.push(`包含主码: ${batch.keys.join(', ')}`);
                        for (const key of batch.keys) {
                            const g = state.groups.find(gr => gr.key === key);
                            if (!g) continue;
                            const typeLabel = g.type === 'fba' ? 'FBA货件' : '自定义箱条码';
                            lines.push(`  ${typeLabel}: ${g.key} (${g.items.length} 箱)`);
                            for (let i = 0; i < g.items.length; i++) {
                                const item = g.items[i];
                                let displayCode = item.code;
                                if (g.type === 'fba') displayCode = `${g.key}/${i+1}`;
                                const scanned = state.scanStatus[item.code] || false;
                                lines.push(`    ${String(i+1).padStart(3,' ')}. ${scanned ? '✅' : '⬜'} ${displayCode}`);
                            }
                        }
                        lines.push('');
                    }
                }

                const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `复核清单_${new Date().toISOString().slice(0,10)}.txt`;
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('📄 TXT已导出', 'success');
            }

            // ---- 导出 Excel ----
            function exportExcel() {
                const wb = XLSX.utils.book_new();

                if (batches.length === 0) {
                    const rows = [];
                    const now = new Date();
                    const dateStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    rows.push(['扫描员:', operator || '']);
                    rows.push(['车牌:', vehicle || '']);
                    rows.push(['导出日期:', dateStr]);
                    rows.push([]);
                    const headers = ['#', '分组类型/Tipo', '分组Key/Guia', '子项序号/No.', '子项条码/Subitem', '已扫描/Escaneado', '箱数/Cajas'];
                    rows.push(headers);
                    let itemIdx = 0;
                    const filteredKeys = getFilteredMainKeys();
                    for (const key of filteredKeys) {
                        const g = state.groups.find(gr => gr.key === key);
                        if (!g) continue;
                        if (selectedAddresses.length > 0 && g.recipients && !g.recipients.some(r => selectedAddresses.includes(r))) continue;
                        const typeLabel = g.type === 'fba' ? 'FBA货件' : '自定义';
                        const totalBoxes = g.items.length;
                        itemIdx++;
                        rows.push([itemIdx, typeLabel, g.key, '', `共${totalBoxes}箱/Total ${totalBoxes} Cajas`, '', '']);
                        for (let i = 0; i < g.items.length; i++) {
                            const item = g.items[i];
                            let displayCode = item.code;
                            if (g.type === 'fba') displayCode = `${g.key}/${i+1}`;
                            const scanned = state.scanStatus[item.code] || false;
                            rows.push(['', '', '', i + 1, displayCode, scanned ? '是/Si' : '否/No', scanned ? 1 : 0]);
                        }
                    }
                    const ws = XLSX.utils.aoa_to_sheet(rows);
                    ws['!cols'] = [{ wch: 5 }, { wch: 18 }, { wch: 15 }, { wch: 12 }, { wch: 20 }, { wch: 18 }, { wch: 12 }];
                    const sheetName = vehicle ? `Placas ${vehicle}` : '复核清单';
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                } else {
                    const groups = {};
                    for (const batch of batches) {
                        const key = `${batch.operator}|${batch.vehicle}`;
                        if (!groups[key]) {
                            groups[key] = {
                                operator: batch.operator || '',
                                vehicle: batch.vehicle || '',
                                batches: []
                            };
                        }
                        groups[key].batches.push(batch);
                    }

                    for (const key of Object.keys(groups)) {
                        const group = groups[key];
                        const rows = [];
                        const now = new Date();
                        const dateStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        rows.push(['扫描员:', group.operator]);
                        rows.push(['车牌:', group.vehicle]);
                        rows.push(['导出日期:', dateStr]);
                        rows.push([]);

                        const headers = ['#', '分组类型/Tipo', '分组Key/Guia', '子项序号/No.', '子项条码/Subitem', '已扫描/Escaneado', '箱数/Cajas'];

                        for (const batch of group.batches) {
                            rows.push(['批次', batch.name]);
                            rows.push(['主码列表/Master Envio', batch.keys.join(', ')]);
                            rows.push([]);
                            rows.push(headers);

                            let itemIdx = 0;
                            for (const batchKey of batch.keys) {
                                const g = state.groups.find(gr => gr.key === batchKey);
                                if (!g) continue;
                                if (selectedAddresses.length > 0 && g.recipients && !g.recipients.some(r => selectedAddresses.includes(r))) continue;
                                const typeLabel = g.type === 'fba' ? 'FBA货件' : '自定义';
                                const totalBoxes = g.items.length;
                                itemIdx++;
                                rows.push([itemIdx, typeLabel, g.key, '', `共${totalBoxes}箱/Total ${totalBoxes} Cajas`, '', '']);
                                for (let i = 0; i < g.items.length; i++) {
                                    const item = g.items[i];
                                    let displayCode = item.code;
                                    if (g.type === 'fba') displayCode = `${g.key}/${i+1}`;
                                    const scanned = state.scanStatus[item.code] || false;
                                    rows.push(['', '', '', i + 1, displayCode, scanned ? '是/Si' : '否/No', scanned ? 1 : 0]);
                                }
                            }
                            rows.push([]);
                        }
                        while (rows.length > 0 && rows[rows.length - 1].length === 0) rows.pop();

                        const ws = XLSX.utils.aoa_to_sheet(rows);
                        ws['!cols'] = [{ wch: 5 }, { wch: 18 }, { wch: 15 }, { wch: 12 }, { wch: 20 }, { wch: 18 }, { wch: 12 }];
                        let sheetName = group.vehicle ? `Placas ${group.vehicle}` : (group.operator || '未命名');
                        const existingSheets = wb.SheetNames;
                        let suffix = 1;
                        let baseName = sheetName;
                        while (existingSheets.includes(sheetName)) {
                            sheetName = `${baseName}_${suffix}`;
                            suffix++;
                        }
                        XLSX.utils.book_append_sheet(wb, ws, sheetName);
                    }
                }

                const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([out], { type: 'application/octet-stream' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `复核清单_${new Date().toISOString().slice(0,10)}.xlsx`;
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('📊 Excel已按批次导出', 'success');
            }

            // ---- 更改地址 ----
            function changeAddress() {
                if (allRows.length === 0) {
                    showToast(t('upload_first'), 'warning');
                    return;
                }
                const recips = allRecipients;
                if (recips.length === 0) {
                    showToast(t('no_delivery_info'), 'warning');
                    return;
                }
                renderAddressSelector(recips, allRows, false);
            }

            // ---- 身份验证 ----
            function showOperatorModal(reauth = false) {
                isReauth = reauth;
                if (reauth) {
                    modalTitle.textContent = t('auth_title');
                    operatorInput.value = operator || '';
                    vehicleInput.value = vehicle || '';
                } else {
                    modalTitle.textContent = t('auth_title');
                    operatorInput.value = '';
                    vehicleInput.value = '';
                }
                operatorModal.style.display = 'flex';
                setTimeout(() => operatorInput.focus(), 100);
            }

            function hideOperatorModal() {
                operatorModal.style.display = 'none';
            }

            function confirmIdentity() {
                const op = operatorInput.value.trim();
                const veh = vehicleInput.value.trim();
                if (!op || !veh) {
                    showToast('请填写完整信息', 'error');
                    return;
                }
                operator = op;
                vehicle = veh;
                localStorage.setItem('operator', operator);
                localStorage.setItem('vehicle', vehicle);
                operatorDisplay.textContent = operator;
                vehicleDisplay.textContent = vehicle;

                hideOperatorModal();
                showToast(t('identity_updated'), 'success', 2000);
                scanInput.focus();

                if (isReauth) {
                    isReauth = false;
                } else {
                    if (!isInitialized) {
                        proceedAfterAuth();
                        isInitialized = true;
                    }
                }
            }

            // ---- 初始化 ----
            function init() {
                console.log('🚀 页面初始化...');
                loadLocalState();
                console.log('📂 恢复本地状态:', { localMode, taskKeys, pendingKeys, filterMode, globalStatsCollapsed,
                    resetCollapsed, selectedAddresses, addressCollapsed, batches });

                const savedOperator = localStorage.getItem('operator');
                const savedVehicle = localStorage.getItem('vehicle');
                if (savedOperator && savedVehicle) {
                    operator = savedOperator;
                    vehicle = savedVehicle;
                    operatorDisplay.textContent = operator;
                    vehicleDisplay.textContent = vehicle;
                    isInitialized = true;
                    proceedAfterAuth();
                } else {
                    showOperatorModal(false);
                }

                changeIdentityBtn.addEventListener('click', function() {
                    console.log('🔄 更换身份按钮被点击');
                    showOperatorModal(true);
                });

                confirmOperatorBtn.addEventListener('click', confirmIdentity);

                cancelOperatorBtn.addEventListener('click', function() {
                    hideOperatorModal();
                    if (!isInitialized) {
                        showToast('请完成身份验证', 'warning');
                        setTimeout(() => showOperatorModal(false), 300);
                    }
                });

                operatorInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') confirmIdentity();
                });
                vehicleInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') confirmIdentity();
                });

                operatorModal.addEventListener('click', function(e) {
                    if (e.target === operatorModal && isInitialized) {
                        hideOperatorModal();
                    }
                });

                addressToggle.addEventListener('click', function() {
                    addressCollapsed = !addressCollapsed;
                    updateStatusBar();
                    saveLocalState();
                });

                changeAddressBtn.addEventListener('click', changeAddress);
            }

            // ---- 身份验证通过后的初始化 ----
            function proceedAfterAuth() {
                connectWebSocket();

                globalStatsToggle.addEventListener('click', function() {
                    globalStatsCollapsed = !globalStatsCollapsed;
                    updateStatusBar();
                    saveLocalState();
                });

                resetCollapseToggle.addEventListener('click', function() {
                    resetCollapsed = !resetCollapsed;
                    updateStatusBar();
                    saveLocalState();
                });

                toggleDoneBtn.addEventListener('click', toggleFilterMode);

                scanBtn.addEventListener('click', function() {
                    const code = scanInput.value.trim();
                    sendScan(code);
                });

                scanInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const code = this.value.trim();
                        sendScan(code);
                    }
                });

                endMainBtn.addEventListener('click', switchToSubMode);
                forceEndBtn.addEventListener('click', forceEnd);
                resetBatchBtn.addEventListener('click', resetMyKeys);
                resetAllBtn.addEventListener('click', resetAll);

                fileInput.addEventListener('change', function(e) {
                    if (this.files.length) handleFile(this.files[0]);
                    this.value = '';
                });
                uploadZone.addEventListener('click', function() { fileInput.click(); });
                uploadZone.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    this.style.borderColor = '#2563eb';
                });
                uploadZone.addEventListener('dragleave', function(e) {
                    e.preventDefault();
                    this.style.borderColor = '#cbd5e1';
                });
                uploadZone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.style.borderColor = '#cbd5e1';
                    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
                });

                exportTxtBtn.addEventListener('click', exportTxt);
                exportExcelBtn.addEventListener('click', exportExcel);

                window.addEventListener('beforeunload', function() {
                    if (ws) ws.close();
                });

                // 语言切换
                document.getElementById('langSwitch').addEventListener('click', function() {
                    setLang(currentLang === 'zh' ? 'es' : 'zh');
                });

                // 初始化语言
                setLang(currentLang);

                // 更新 UI
                updateUI();
                updateStatusBar();
                renderList();
                setTimeout(() => {
                    scanInput.focus();
                }, 500);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
